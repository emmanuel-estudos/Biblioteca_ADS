<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Biblioteca ADS</title>
    <script type="text/javascript">
      // Pega o caminho atual da URL e converte em query string para o index.html entender
      var pathSegmentsToKeep = 1; // Mantém /Biblioteca_ADS/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
